services:

  postgres:
    image: postgres:17
    container_name: buildsense-postgres

    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - buildsense-network


  redis:
    image: redis:8-alpine

    container_name: buildsense-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - buildsense-network


  minio:
    image: minio/minio

    container_name: buildsense-minio

    command: server /data --console-address ":9001"

    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    networks:
      - buildsense-network


  adminer:
    image: adminer

    container_name: buildsense-adminer

    restart: unless-stopped

    ports:
      - "${ADMINER_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - buildsense-network


volumes:

  postgres_data:

  redis_data:

  minio_data:


networks:

  buildsense-network:
    driver: bridge