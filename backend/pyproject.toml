[project]
name = "buildsense-backend"
version = "0.1.0"
description = "AI-powered quantity surveying backend"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "fastapi",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
